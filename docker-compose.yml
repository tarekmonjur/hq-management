services:
  hq-db:
    extends:
        file: ./apps/api/docker-compose.db.yml
        service: hq-database

  hq-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    container_name: hq-api
    restart: always
    env_file:
      - ./apps/api/.env
    environment:
      NODE_ENV: development
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - ./apps/api:/app
    command: npm run start:dev 
    depends_on:
      hq-db:
        condition: service_healthy
